# ? Assuming exec-once are launched in order as declared here

exec-once = dbus-update-activation-environment --systemd --all
exec-once = $LIB_DIR/resetxdgportal.sh
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = awww-daemon --format xrgb
exec-once = dunst
exec-once = hypridle
exec-once = $LIB_DIR/swwwallswitch.sh --populate
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = udiskie -t
exec-once = nm-applet --indicator
exec-once = uwsm app -- $LIB_DIR/vyle-config & disown

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard primary


