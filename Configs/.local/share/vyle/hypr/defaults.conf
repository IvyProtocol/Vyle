
# // █▀▄▀█ █▀█ █▄░█ █ ▀█▀ █▀█ █▀█
# // █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄

# See https://wiki.hypr.land/Configuring/Monitors/

monitor = ,preferred,auto,auto

# // █▀ █▀█ █▀▀ █▀▀ █ ▄▀█ █░░
# // ▄█ █▀▀ ██▄ █▄▄ █ █▀█ █▄▄

general {
  resize_on_border = true
  no_focus_fallback = true
  allow_tearing = true
  layout = dwindle

  snap {
    enabled = true
    window_gap = 4
    monitor_gap = 6
    respect_gaps = true
  }
}

decoration {
	active_opacity = 0.90
	inactive_opacity = 0.75
	fullscreen_opacity = 1
	dim_strength = 0.1
	dim_special = 0.3

	blur {
    special = true
    brightness = 1
    noise = 0.04
    contrast = 1
    popups = true
    popups_ignorealpha = 0.6
    input_methods = true
    input_methods_ignorealpha = 0.8
	}
}

# // ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# // █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█

# See https://wiki.hypr.land/Configuring/Animations/

animations {
  enabled = yes
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 6, winIn, slide
  animation = windowsOut, 1, 5, winOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = borderangle, 1, 30, liner, once
  animation = fade, 1, 10, default
  animation = workspaces, 1, 5, wind
}

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


input {
    # See https://wiki.hypr.land/Configuring/Variables/#input
    accel_profile = flat
    numlock_by_default = true
}

#See https://wiki.hypr.land/Configuring/Gestures/
gesture = 3, horizontal, workspace
gesture = 3, pinchin,float,tile
gesture = 3, pinchout,float, float


# // █░░ ▄▀█ █▄█ █▀█ █░█ ▀█▀ █▀
# // █▄▄ █▀█ ░█░ █▄█ █▄█ ░█░ ▄█

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/

dwindle {
	preserve_split = true
	smart_split = false
	smart_resizing = true
}

# See https://wiki.hypr.land/Configuring/Master-Layout/

master {
	new_status = master
}

# // █▀▄▀█ █ █▀ █▀▀
# // █░▀░█ █ ▄█ █▄▄

# See https://wiki.hypr.land/Configuring/Variables/#misc

misc {
	disable_hyprland_logo = true
	disable_splash_rendering = true
	vrr = 0
	mouse_move_enables_dpms = true
	key_press_enables_dpms = true
	animate_manual_resizes = false
	animate_mouse_windowdragging = true
	focus_on_activate = true
	on_focus_under_fullscreen = 1
	force_default_wallpaper = 0
	anr_missed_pings = 5
	allow_session_lock_restore = true
}

xwayland {
	force_zero_scaling = true
}

# Super Key defined - Let user override it from hyprland.conf
$MOD = SUPER
$mainMod = $MOD
