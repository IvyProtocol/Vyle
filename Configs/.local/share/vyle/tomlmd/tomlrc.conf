source "$VYLE_DATA_HOME/staterc.conf"

#  █░█ █▄█ █░░ █▀▀ 
#  ▀▄▀ ░█░ █▄▄ ██▄  

#// skipTemplate, specifies .ivy or .dcol template that should be excluded or skipped from procesing!
#// This allows you to selectively exclude certain template that exists in ${ideDir} while still processing others.
#// example:
skipTemplate=${VYLE_CONFIGURATION_SKIP_TEMPLATE[@]}

#// nProcCount, lets wallbash use the maximum or limited CPU utilization to process templates!
#// You can limit the core utilization by declaring the number of cores to be utilized.
#// Defaulted is '3', but $(nproc) can be used here. e.g., nProcCount=$(nproc).
nProcCount=${VYLE_CONFIGURATION_CORE}

# █░█░█ ▄▀█ █░░ █░░ █▀█ ▄▀█ █▀█ █▀▀ █▀█
# ▀▄▀▄▀ █▀█ █▄▄ █▄▄ █▀▀ █▀█ █▀▀ ██▄ █▀▄

# Chosen Backend! SWWW
wallBackend="${WALLPAPER_CONFIGURATION_BACKEND}"

#// set the transition FPS while changing wallpaper.
wallFramerate=${WALLPAPER_SWWW_FRAMERATE}

#// set the transition duration for swww while changing wallpaper.
wallTransDuration=${WALLPAPER_SWWW_TRANSITION_DURATION}

#// set animation for swww while changing wallpaper.
wallAnimationPrevious="${WALLPAPER_SWWW_ANIMATION_PREVIOUS}"
wallAnimationNext="${WALLPAPER_SWWW_ANIMATION_NEXT}"
wallAnimationTheme="${WALLPAPER_SWWW_ANIMATION_THEME}"

# set transition-bezier for swww while changing wallpaper.
wallTransitionBezier="${WALLPAPER_SWWW_TRANSITION_BEZIER}"

#// WallAddCustomPath, sets a custom user directories scanned for wallpapers.
#// add your wallpaper directories as - WallAddCustomPath=("/path/to/wall/dir1" "/path/to/wall/dir2")
#// setting a custom directory for wallDir would result in to cache wallpapers by $XDG_LOCAL_BIN/swwwallcache.sh!
#// example:
WallAddCustomPath=("${WALLPAPER_CONFIGURATION_CUSTOMPATH[@]}")

# █▀█ █▀█ █▀▀ █
# █▀▄ █▄█ █▀░ █

# rofiLauncher.sh configuration.
rofiLauncherFont="${ROFI_LAUNCH_FONT}"
rofiLauncherScale=${ROFI_LAUNCH_SCALE}
rofiLauncherStyle=${ROFI_LAUNCH_STYLE}


# wbselecgen.sh configuration
rofiWallpaperFont="${ROFI_WALLPAPER_FONT}"
rofiWallpaperScale=${ROFI_WALLPAPER_SCALE}
rofiWallpaperColumn=${ROFI_WALLPAPER_COLUMN}

# themeswitch.sh configuration.
rofiThemeFont="${ROFI_THEME_FONT}"
rofiThemeScale=${ROFI_THEME_SCALE}
rofiThemeColumn=${ROFI_THEME_COLUMN}
rofiThemeStyle=${ROFI_THEME_STYLE}

# style-launcher.sh configuration.
rofiStyleScale=${ROFI_SWITCH_SCALE}

# wallbashtoggle.sh configuration
rofiWallbashFont="${ROFI_WALLBASH_FONT}"
rofiWallbashScale=${ROFI_WALLBASH_SCALE}

# █░░ █▀█ █▀▀ █▀█ █░█ ▀█▀
# █▄▄ █▄█ █▄█ █▄█ █▄█ ░█░

#// wlogoutStyle sets the style for logout menu
#// available styles - 1 (default) , 2
wlogoutStyle=${WLOGOUT_STYLE}

# █▀▀ ▄▀█ █▀ ▀█▀ █▀▀ █▀▀ ▀█▀ █▀▀ █░█
# █▀░ █▀█ ▄█ ░█░ █▀░ ██▄ ░█░ █▄▄ █▀█

#// fetchIcon, sets the user directories scanned for finding fastfetch icons and randomizes. Default is to $XDG_CONFIG_HOME/fastfetch/icons!
fetchIcon="${FASTFETCH_FETCHICON}"

# █▄▄ █▀█ █ █▀  █░█ ▀█▀ █▄░█ █▀▀ █▀ █▀ █▀ ▀█▀ █░░ 
# █▄█ █▀▄ █ █▄█ █▀█ ░█░ █░▀█ ██▄ ▄█ ▄█ █▄ ░█░ █▄▄

#// brightnesscontrol.sh configuration, declarable according to user preference.
#// brightnessIconDir is string-type variable that needs directory for dunst to use icons.
#// brightnessStep is integer-type variable that is determined through 0 (true) and 1 (False).
#// brightnessNotify is integer-type, determined of 0 and 1.
brightnessIconDir="${BRIGHTNESS_CONFIGURATION_FETCHICON}"
brightnessStep=${BRIGHTNESS_CONFIGURATION_STEPS}
brightnessNotify=${BRIGHTNESS_CONFIGURATION_NOTIFY_MUTE}

# █░█ █▀█ █░░ █░█ █▀▄▀█ █▀▀ █▀ ▀█▀ █░░ 
# ▀▄▀ █▄█ █▄▄ █▄█ █░▀░█ ██▄ █▄ ░█░ █▄▄

#// voluemcontrol.sh configuration, declarable according to user preference.
#// volumeStep is an integer-type variable to determine the steps. For example, volumeStep is defaultly set to 5.
#// volumeNotifyUpdateLevel & volumeNotifyMute, is an integer-type variable that suppress Notification-Popups determined through 0 (true) or {1 or greater (false)}.
volumeIconDir="${VOLUME_CONFIGURATION_FETCHICON}"
volumeStep=${VOLUME_CONFIGURATION_STEPS}
volumeNotifyUpdateLevel=${VOLUME_CONFIGURATION_STEPS_MUTE}
volumeNotifyMute=${VOLUME_CONFIGURATION_NOTIFY_MUTE}

# █▄░█ █▀█ ▀█▀ █ █▀▀ █ █▀▀ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █░▀█ █▄█ ░█░ █ █▀░ █ █▄▄ █▀█ ░█░ █ █▄█ █░▀█
# dunstctl configuration
notificationFont="${NOTIFICATION_CONFIGURATION_FONT}"
notificationFontSize=${NOTIFICATION_CONFIGURATION_FONT_SIZE}

# █░█ █▄█ █▀█ █▀█ █░░ ▄▀█ █▄░█ █▀▄
# █▀█ ░█░ █▀▀ █▀▄ █▄▄ █▀█ █░▀█ █▄▀

# Hyprland Configuration.
CONSOLE="${HYPRLAND_CONFIGURATION_TERMINAL}"
EDITOR="${HYPRLAND_CONFIGURATION_EDITOR}"
EXPLORER="${HYPRLAND_CONFIGURATION_EXPLORER}"
BROWSER="${HYPRLAND_CONFIGURATION_BROWSER}"
LOCK_SCREEN="${HYPRLAND_CONFIGURATION_LOCK_SCREEN}"
TASK_MANAGER="${HYPRLAND_CONFIGURATION_TASK_MANAGER}"
CURSOR_THEME="${HYPRLAND_CONFIGURATION_CURSOR}"
CURSOR_SIZE=${HYPRLAND_CONFIGURATION_CURSOR_SIZE}

# █▀▀ ▀█▀ █▄▀
# █▄█ ░█░ █░█
# GTK Configuration
GTK_FONT_NAME="${GTK_CONFIGURATION_FONT}"
GTK_FONT_ANTIALIASING="${GTK_CONFIGURATION_FONT_ANTIALIASING}"
GTK_FONT_HINTING="${GTK_CONFIGURATION_FONT_HINTING}"
GTK_FONT_SIZE=${GTK_CONFIGURATION_FONT_SIZE}
GTK_DOCUMENT_FONT="${GTK_CONFIGURATION_DOCUMENT_FONT}"
GTK_DOCUMENT_FONT_SIZE=${GTK_CONFIGURATION_DOCUMENT_FONT_SIZE}
GTK_MONOSPACE_FONT="${GTK_CONFIGURATION_MONOSPACE_FONT}"
GTK_MONOSPACE_FONT_SIZE=${GTK_CONFIGURATION_MONOSPACE_FONT_SIZE}

