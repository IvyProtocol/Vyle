#? ------- Variables ----------------
# Default if commented out
# $mainMod = Super # super / meta / windows key
# Assign apps
# $TERMINAL = kitty
# $EDITOR = vscodium
# $EXPLORER = dolphin
# $BROWSER = firefox
# $LOCKSCREEN = hyprlock
# $TASKMANAGER = gnome-system-monitor
$d=[$ws]
# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
# Kitty binds:
bind = $mainMod, Return, exec, $TERMINAL # Kitty
bind = $mainMod, T, exec, $TERMINAL # Another keybind for Kitty
bind = $mainMod, K, exec, $hyprscrDir/tile-terminal.sh $TERMINAL

#Application Keybindings:
bind = $mainMod, E, exec, $EXPLORER # Dolphin File Manager
bind = $mainMod, W, exec, $BROWSER # Toggle Browser
bind = $mainMod, P, exec, $TERMINAL fish -li -c "mpc update & ncmpcpp" #Toggle Music Player Daemon
bind = $mainMod, C, exec, $EDITOR # Toggle VSCodium
bind = Ctrl+Shift, Escape, exec, $TASKMANAGER #TaskManager

# Rofi Keybindings:
bind = $mainMod, D, exec, pkill -x rofi || $scrDir/rofilauncher.sh #Toggle Rofi Menu
bind = $mainMod+Shift, E, exec, pkill -x rofi || $scrDir/rofilauncher.sh -f 
bind = $mainMod+Shift, D, exec, pkill -x rofi || $scrDir/style-launcher.sh #Toggle Rofi Selection menu
bind = $mainMod, V, exec, pkill -x rofi || $scrDir/wl-clipmanager.sh
bind = $mainMod+Ctrl, R, exec, $hyprscrDir/toggle-waybar.sh #Waybar Reload
bind = $mainMod+Shift, Y, exec, pkill -x rofi || $scrDir/WaybarLayout.sh #Toggle Waybar Layout
bind = $mainMod+Alt, S, exec, pkill -x rofi || $scrDir/sddm-style.sh #Toggle SDDM Style
bind = $mainMod, H, exec, $scrDir/wl-togglesink.sh

# Screenshot-Bindings:
bind = $mainMod, Print, exec, $scrDir/wl-screenshot.sh --now
bind = $mainMod+Shift, Print, exec, $scrDir/wl-screenshot.sh --area
bind = ALT, Print, exec, $scrDir/wl-screenshot.sh --active

# Power Bindings:
bind = Ctrl+Alt, Delete, exec, $scrDir/logoutlaunch.sh #Toggle Power Menu
bind = $mainMod, L, exec, $LOCKSCREEN #Toggle Lock Screen

#Misc
bind = $mainMod, Q, killactive, #Kill Active Window
bind = $mainMod+Alt, Space, togglefloating #Toggle Float
bind = $mainMod, J, togglesplit, # Toggle Split
bind = $mainMod, F, fullscreen, 1 # Maximize
bind = $mainMod+Shift, F, fullscreen, 0 # Fullscreen

# Theme Related:
bind = $mainMod+Shift, W, exec, pkill -x rofi || $scrDir/swwwallswitch.sh #Toggle Wallpaper Menu
bind = $mainMod+Shift, R, exec, pkill -x rofi || $scrDir/wallbashtoggle.sh
bind = $mainMod+Shift, T, exec, pkill -x rofi || $scrDir/themeswitch.sh
bind = $mainMod+Alt, T, exec, $scrDir/swwwallswitch.sh -r  #Toggle Random Wallpaper
bind = $mainMod+Alt, up, exec, $scrDir/swwwallswitch.sh -n # Next Wallpaper
bind = $mainMod+Alt, down, exec, $scrDir/swwwallswitch.sh -p # Previous wallpaper
bind = $mainMod+Shift, right, exec, $scrDir/themeswitch.sh -n
bind = $mainMod+Shift, left, exec, $scrDir/themeswitch.sh -p

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move Windows to an existing Tile
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move focused window to a relative workspace
bindd = $mainMod+Alt, Right, $d move window to next relative workspace , movetoworkspace, r+1
bindd = $mainMod+Alt, Left, $d move window to previous relative workspace , movetoworkspace, r-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindd = $mainMod+Alt, P, Toggle floating, togglefloating

bindel = , XF86AudioRaiseVolume, exec, $scrDir/volumecontrol.sh -o i
bindel = , XF86AudioLowerVolume, exec, $scrDir/volumecontrol.sh -o d
bindel = , XF86AudioMicMute, exec, $scrDir/volumecontrol.sh -i m
bindel = , XF86AudioMute, exec, $scrDir/volumecontrol.sh -o m

bindel = ,XF86MonBrightnessUp, exec, $scrDir/brightnesscontrol.sh --inc
bindel = ,XF86MonBrightnessDown, exec, $scrDir/brightnesscontrol.sh --dec


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

